<div class="inscription-container">
  <div class="inscription-card">
    <h2>{{ 'evenement.titre' | translate }}</h2>
    <p class="sous-titre">{{ 'evenement.sousTitre' | translate }}</p>

    <div *ngIf="demandeEnvoyee" class="confirmation">
      <p>{{ 'evenement.confirmationTexte1' | translate }}</p>
      <p>{{ 'evenement.confirmationTexte2' | translate }}</p>
      <a routerLink="/bienvenue">{{ 'evenement.retourAccueil' | translate }}</a>
    </div>

    <form *ngIf="!demandeEnvoyee" (ngSubmit)="envoyerDemande()">
      <div class="champ">
        <label>{{ 'evenement.typePrestationLabel' | translate }}</label>
        <select [(ngModel)]="typePrestation" name="typePrestation">
          <option *ngFor="let type of typesDisponibles" [value]="type">{{ 'evenement.types.' + type | translate }}</option>
        </select>
      </div>

      <div class="ligne-double">
        <div class="champ">
          <label>{{ 'evenement.dateLabel' | translate }}</label>
          <input
            type="date"
            [(ngModel)]="date"
            name="date"
            [class.invalide]="erreurDate"
            (blur)="validerDate()"
          />
          <p *ngIf="erreurDate" class="erreur-champ">{{ erreurDate }}</p>
        </div>

        <div class="champ">
          <label>{{ 'evenement.heureLabelOptionnel' | translate }}</label>
          <input type="time" [(ngModel)]="heure" name="heure" />
        </div>
      </div>

      <div class="ligne-double">
        <div class="champ">
          <label>{{ 'evenement.nombrePersonnesLabel' | translate }}</label>
          <input type="number" [(ngModel)]="nombrePersonnes" name="nombrePersonnes" min="1" />
        </div>

        <div class="champ">
          <label>{{ 'evenement.budgetLabel' | translate }}</label>
          <input type="number" [(ngModel)]="budgetIndicatif" name="budgetIndicatif" min="0" />
        </div>
      </div>

      <div class="champ">
        <input
          type="text"
          [(ngModel)]="nom"
          name="nom"
          [placeholder]="'evenement.nomPlaceholder' | translate"
          [class.invalide]="erreurNom"
          (blur)="validerNom()"
        />
        <p *ngIf="erreurNom" class="erreur-champ">{{ erreurNom }}</p>
      </div>

      <div class="champ">
        <input
          type="tel"
          [(ngModel)]="telephone"
          name="telephone"
          [placeholder]="'evenement.telephonePlaceholder' | translate"
          [class.invalide]="erreurTelephone"
          (blur)="validerTelephone()"
        />
        <p *ngIf="erreurTelephone" class="erreur-champ">{{ erreurTelephone }}</p>
      </div>

      <div class="champ">
        <textarea
          [(ngModel)]="description"
          name="description"
          [placeholder]="'evenement.descriptionPlaceholder' | translate"
          rows="3"
        ></textarea>
      </div>

      <p *ngIf="erreur" class="erreur">{{ erreur }}</p>

      <button type="submit" [disabled]="chargement">
        {{ chargement ? ('evenement.envoiEnCours' | translate) : ('evenement.envoyerDemande' | translate) }}
      </button>
    </form>
  </div>
</div>
