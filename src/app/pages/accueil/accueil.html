<div class="accueil-container">
  <div class="logo-header">
    <img src="icons/icon-192x192.png" alt="Resta" class="logo-icone" />
  </div>
  <h1>{{ 'accueil.titre' | translate }}</h1>
  <p>{{ 'accueil.sousTitre' | translate }}</p>

  <button routerLink="/scan">{{ 'accueil.surPlace' | translate }}</button>
  <button routerLink="/localite">{{ 'accueil.livraison' | translate }}</button>
  <button [routerLink]="['/localite']" [queryParams]="{ intention: 'reservation' }">{{ 'accueil.reservation' | translate }}</button>
  <button [routerLink]="['/localite']" [queryParams]="{ intention: 'evenement' }">{{ 'accueil.evenement' | translate }}</button>
</div>
