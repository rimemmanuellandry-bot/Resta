<div class="inscription-container">
  <div class="inscription-card">
    <div class="logo-header">
      <img src="icons/icon-192x192.png" alt="Resta" class="logo-icone" />
    </div>
    <h2>{{ 'connexion.titre' | translate }}</h2>
    <p class="sous-titre">{{ 'connexion.sousTitre' | translate }}</p>

    <form (ngSubmit)="seConnecter()">
      <div class="champ">
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          [placeholder]="'connexion.emailPlaceholder' | translate"
        />
      </div>

      <div class="champ">
        <div class="champ-mot-de-passe-wrapper">
          <input
            [type]="afficherMotDePasse ? 'text' : 'password'"
            [(ngModel)]="motDePasse"
            name="motDePasse"
            [placeholder]="'connexion.motDePassePlaceholder' | translate"
          />
          <button
            type="button"
            class="btn-oeil"
            (click)="afficherMotDePasse = !afficherMotDePasse"
            [attr.aria-label]="'connexion.afficherMasquerAria' | translate"
          >
            {{ afficherMotDePasse ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>

      <p *ngIf="erreur" class="erreur">{{ erreur }}</p>

      <button type="submit" [disabled]="chargement">
        {{ chargement ? ('connexion.connexionEnCours' | translate) : ('connexion.seConnecter' | translate) }}
      </button>
    </form>

    <p class="lien-secondaire">
      {{ 'connexion.pasDeCompte' | translate }} <a routerLink="/">{{ 'inscription.sInscrire' | translate }}</a>
    </p>
  </div>
</div>
