<div class="inscription-container">
  <div class="inscription-card">
    <div class="logo-header">
      <img src="icons/icon-192x192.png" alt="Resta" class="logo-icone" />
    </div>
    <h2>{{ 'inscription.titre' | translate }}</h2>
    <p class="sous-titre">{{ 'inscription.sousTitre' | translate }}</p>

    <form (ngSubmit)="sInscrire()">
      <div class="champ">
        <input
          type="text"
          [(ngModel)]="nom"
          name="nom"
          [placeholder]="'inscription.nomPlaceholder' | translate"
          [class.invalide]="erreurNom"
          (blur)="validerNom()"
        />
        <p *ngIf="erreurNom" class="erreur-champ">{{ erreurNom }}</p>
      </div>

      <div class="champ">
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          [placeholder]="'inscription.emailPlaceholder' | translate"
          [class.invalide]="erreurEmail"
          (blur)="validerEmail()"
        />
        <p *ngIf="erreurEmail" class="erreur-champ">{{ erreurEmail }}</p>
      </div>

      <div class="champ">
        <div class="champ-mot-de-passe-wrapper">
          <input
            [type]="afficherMotDePasse ? 'text' : 'password'"
            [(ngModel)]="motDePasse"
            name="motDePasse"
            [placeholder]="'inscription.motDePassePlaceholder' | translate"
            [class.invalide]="erreurMotDePasse"
            (blur)="validerMotDePasse()"
          />
          <button
            type="button"
            class="btn-oeil"
            (click)="afficherMotDePasse = !afficherMotDePasse"
            [attr.aria-label]="'inscription.afficherMasquerAria' | translate"
          >
            {{ afficherMotDePasse ? '🙈' : '👁️' }}
          </button>
        </div>
        <p *ngIf="erreurMotDePasse" class="erreur-champ">{{ erreurMotDePasse }}</p>
      </div>

      <p *ngIf="erreur" class="erreur">{{ erreur }}</p>

      <button type="submit" [disabled]="chargement">
        {{ chargement ? ('inscription.creationEnCours' | translate) : ('inscription.sInscrire' | translate) }}
      </button>
    </form>
    <p class="lien-secondaire">
      {{ 'inscription.dejaCompte' | translate }} <a routerLink="/connexion">{{ 'inscription.seConnecter' | translate }}</a>
    </p>
  </div>
</div>
