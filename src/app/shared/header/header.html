<header class="app-header">
  <div class="header-gauche">
    <button *ngIf="afficherRetour" (click)="retour()" class="btn-retour" aria-label="Retour">
      ←
    </button>
    <a [routerLink]="estConnecte ? '/bienvenue' : '/'" class="logo-lien">
      <img src="icons/icon-192x192.png" alt="Resta" class="logo-icone" />
      <span class="logo-texte">Resta</span>
    </a>
  </div>

  <a *ngIf="!estConnecte" routerLink="/connexion" class="lien-connexion">{{ 'header.seConnecter' | translate }}</a>

  <button *ngIf="estConnecte" (click)="toggleMenu()" class="btn-menu" aria-label="Menu">
    ☰
  </button>
</header>

<div class="menu-overlay" *ngIf="menuOuvert" (click)="fermerMenu()"></div>

<nav class="menu-lateral" [class.ouvert]="menuOuvert">
  <button class="btn-fermer-menu" (click)="fermerMenu()" aria-label="Fermer">✕</button>

  <a routerLink="/mes-commandes" *ngIf="!estAdmin" (click)="fermerMenu()">{{ 'header.mesCommandes' | translate }}</a>
  <a [routerLink]="['/admin']" [queryParams]="{ restaurant_id: restaurantId }" *ngIf="estAdmin" (click)="fermerMenu()">{{ 'header.admin' | translate }}</a>

  <div class="menu-langues">
