<header class="app-header">
  <div class="header-gauche">
    <button *ngIf="afficherRetour" (click)="retour()" class="btn-retour" aria-label="Retour">
      ←
    </button>
    <a [routerLink]="estConnecte ? '/bienvenue' : '/'" class="logo-lien">
      <img src="icons/icon-192x192.png" alt="Resta" class="logo-icone" />
      <span class="logo-texte">Resta</span>
    </a>
  </div>

  <a *ngIf="!estConnecte" routerLink="/connexion" class="lien-connexion">{{ 'header.seConnecter' | translate }}</a>

  <div class="header-droite" *ngIf="estConnecte">
    <button *ngIf="!estAdmin" (click)="toggleNotifications()" class="btn-notif" aria-label="Notifications">
      🔔
      <span class="badge-notif" *ngIf="notificationsNonLues.length > 0">{{ notificationsNonLues.length }}</span>
    </button>

    <button (click)="toggleMenu()" class="btn-menu" aria-label="Menu">
      ☰
    </button>
  </div>
</header>

<div class="notif-overlay" *ngIf="notificationsOuvertes" (click)="fermerNotifications()"></div>

<div class="notif-panel" *ngIf="notificationsOuvertes">
  <div class="notif-header">
    <span>{{ 'notifications.titre' | translate }}</span>
  </div>

  <div class="notif-liste" *ngIf="notificationsNonLues.length > 0 || notificationsLues.length > 0; else notifVide">
   <div class="notif-item" *ngFor="let notif of notificationsNonLues" (click)="marquerVue(notif)">
  <span class="notif-texte">{{ libelleNotification(notif) }}</span>
  <button class="notif-supprimer" (click)="supprimer(notif, $event)">✕</button>
</div>
<div class="notif-item notif-item-lue" *ngFor="let notif of notificationsLues">
  <span class="notif-texte">{{ libelleNotification(notif) }}</span>
  <button class="notif-supprimer" (click)="supprimer(notif, $event)">✕</button>
</div>
  </div>

  <ng-template #notifVide>
    <p class="notif-vide">{{ 'notifications.aucune' | translate }}</p>
  </ng-template>
</div>

<div class="menu-overlay" *ngIf="menuOuvert" (click)="fermerMenu()"></div>

<nav class="menu-lateral" [class.ouvert]="menuOuvert">
  <div class="menu-header">
    <span class="menu-titre">Menu</span>
    <button class="btn-fermer-menu" (click)="fermerMenu()" aria-label="Fermer">✕</button>
  </div>

  <div class="menu-section">
    <a routerLink="/mes-commandes" *ngIf="!estAdmin" (click)="fermerMenu()" class="menu-item">
      <span class="menu-icone">🧾</span> {{ 'header.mesCommandes' | translate }}
    </a>
    <a [routerLink]="['/admin']" [queryParams]="{ restaurant_id: restaurantId }" *ngIf="estAdmin" (click)="fermerMenu()" class="menu-item">
      <span class="menu-icone">⚙️</span> {{ 'header.admin' | translate }}
    </a>
  </div>

  <div class="menu-separateur"></div>

  <div class="menu-section">
    <span class="menu-label">Langue</span>
    <div class="menu-langues">
      <button [class.actif]="langueActuelle === 'fr'" (click)="changerLangue('fr')">FR</button>
      <button [class.actif]="langueActuelle === 'en'" (click)="changerLangue('en')">EN</button>
    </div>
  </div>

  <div class="menu-separateur"></div>

  <button (click)="seDeconnecter()" class="menu-item lien-deconnexion">
    <span class="menu-icone">🚪</span> {{ 'header.deconnexion' | translate }}
  </button>
</nav>
