<header class="app-header">
     <div class="header-gauche">
    <button *ngIf="afficherRetour" (click)="retour()" class="btn-retour" aria-label="Retour">
      ←
    </button>
  <a [routerLink]="estConnecte ? '/bienvenue' : '/'" class="logo-lien">
    <img src="icons/icon-192x192.png" alt="Resta" class="logo-icone" />
    <span class="logo-texte">Resta</span>
  </a>

  <nav class="header-liens" *ngIf="estAdmin">
    <a [routerLink]="['/admin']" [queryParams]="{ restaurant_id: restaurantId }">Admin</a>
    <a [routerLink]="['/statistiques']" [queryParams]="{ restaurant_id: restaurantId }">Statistiques</a>
  </nav>

  <button *ngIf="estConnecte" (click)="seDeconnecter()" class="btn-deconnexion">
    Déconnexion
  </button>
  <a *ngIf="!estConnecte" routerLink="/connexion" class="lien-connexion">Se connecter</a>
</header>
